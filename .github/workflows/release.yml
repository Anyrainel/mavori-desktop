# Builds the Mavori desktop app and publishes a draft release here.
#
# This workflow lives in the PUBLIC releases repository rather than beside the
# code, for two reasons:
#
#   * Actions minutes are free on public repositories and metered on private
#     ones — and macOS bills at a 10x multiplier, which is most of a desktop
#     release. Running here costs nothing against the private allowance.
#   * GITHUB_TOKEN already has write access to this repository, so publishing
#     the release needs no extra credential. Only reading the source does.
#
# The source repository stays private and is checked out with a read-only
# token. Build logs on a public repository are public: nothing here prints
# source, and the config it does print (Supabase URL, API origin) is the same
# config every browser already receives from app.mavori.ai.
#
# Secrets:
#   SOURCE_REPO_TOKEN               read-only contents on Anyrainel/WSPal
#   APPLE_ID, APPLE_APP_SPECIFIC_PASSWORD, APPLE_TEAM_ID
#   CSC_LINK, CSC_KEY_PASSWORD      base64 Developer ID .p12, and its password
#
# Windows ships unsigned — no Authenticode certificate — so SmartScreen warns
# on download until the binary earns reputation.

name: Build desktop release

on:
  workflow_dispatch:
    inputs:
      platforms:
        description: Which platforms to build
        type: choice
        options: [windows, macos, linux, both, all]
        # All supported installers are required by the release finalizer.
        default: all
        required: true
      ref:
        description: Ref of Anyrainel/WSPal to build
        default: main
        required: true

# Only people with write access can dispatch, and there is no trigger a fork
# can reach, so the source token is never exposed to an outside contributor.
permissions:
  contents: write

jobs:
  build:
    strategy:
      # One platform failing should not throw away a good build of the other:
      # electron-builder appends to the same draft, and a rerun fills the gap.
      fail-fast: false
      matrix:
        os: >-
          ${{ fromJSON(inputs.platforms == 'all' && '["macos-14","windows-latest","ubuntu-latest"]'
              || inputs.platforms == 'linux' && '["ubuntu-latest"]'
              || inputs.platforms == 'both' && '["macos-14","windows-latest"]'
              || inputs.platforms == 'macos' && '["macos-14"]'
              || '["windows-latest"]') }}
    runs-on: ${{ matrix.os }}
    name: ${{ matrix.os == 'macos-14' && 'macOS' || matrix.os == 'ubuntu-latest' && 'Linux' || 'Windows' }}
    outputs:
      version: ${{ steps.version.outputs.value }}
      source_sha: ${{ steps.version.outputs.source_sha }}
    steps:
      # One checkout: the shell and the client it wraps are the same commit, so
      # a release names a single SHA rather than a pair that has to be
      # correlated afterwards.
      - uses: actions/checkout@v4
        with:
          repository: Anyrainel/WSPal
          ref: ${{ inputs.ref }}
          token: ${{ secrets.SOURCE_REPO_TOKEN }}

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - uses: pnpm/action-setup@v4

      - name: Cache the pnpm store
        uses: actions/cache@v4
        with:
          path: ~/.pnpm-store
          key: pnpm-${{ runner.os }}-${{ hashFiles('pnpm-lock.yaml') }}
          restore-keys: pnpm-${{ runner.os }}-

      # The desktop app and everything it imports; the mobile-only native
      # toolchain is not needed to export the web bundle.
      - name: Install
        run: pnpm install --frozen-lockfile

      - name: Export the client into the shell
        run: pnpm build:desktop-renderer

      - name: Verify the shell
        run: pnpm --filter @wspal/desktop test

      - name: Read the version being released
        id: version
        shell: bash
        run: |
          version=$(node -p "require('./apps/desktop/package.json').version")
          echo "value=$version" >> "$GITHUB_OUTPUT"
          echo "source_sha=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"

      - name: Build, sign, and publish a draft release
        working-directory: apps/desktop
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          BUILD_OS: ${{ matrix.os }}
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_APP_SPECIFIC_PASSWORD: ${{ secrets.APPLE_APP_SPECIFIC_PASSWORD }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
          CSC_LINK: ${{ matrix.os == 'macos-14' && secrets.CSC_LINK || '' }}
          CSC_KEY_PASSWORD: ${{ matrix.os == 'macos-14' && secrets.CSC_KEY_PASSWORD || '' }}
        # Notarization is a request to Apple that needs credentials; asking
        # without them fails the build outright rather than degrading.
        run: |
          if [ "$BUILD_OS" = "macos-14" ]; then
            if [ -z "$CSC_LINK" ] || [ -z "$APPLE_ID" ] || [ -z "$APPLE_APP_SPECIFIC_PASSWORD" ] || [ -z "$APPLE_TEAM_ID" ]; then
              echo "macOS requires Developer ID signing and notarization credentials." >&2
              exit 1
            fi
            pnpm build --publish always
          else
            echo "Building $BUILD_OS without Apple notarization."
            pnpm build --publish always -c.mac.notarize=false
          fi

      # asar packing, the custom scheme's registration and the bundle's
      # root-absolute asset paths only meet each other inside a real package.
      # A build that white-screens passes every other gate in the repo.
      - name: Boot the packaged app
        if: matrix.os != 'ubuntu-latest'
        run: pnpm --filter @wspal/desktop smoke:packaged

      - name: Boot the Linux packaged app
        if: matrix.os == 'ubuntu-latest'
        run: |
          sudo chown root:root apps/desktop/release/linux-unpacked/chrome-sandbox
          sudo chmod 4755 apps/desktop/release/linux-unpacked/chrome-sandbox
          xvfb-run --auto-servernum pnpm --filter @wspal/desktop smoke:packaged

  provenance:
    needs: build
    if: needs.build.result == 'success'
    runs-on: ubuntu-latest
    steps:
      # Targets the release by name rather than "the newest one", so a stale
      # draft left over from an earlier attempt cannot be edited by mistake.
      - name: Record what the draft was built from
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: v${{ needs.build.outputs.version }}
          SOURCE_REF: ${{ needs.build.outputs.source_sha }}
          PLATFORMS: ${{ inputs.platforms }}
        shell: bash
        run: |
          {
            echo "Built from Anyrainel/WSPal @ $SOURCE_REF."
            echo
            echo "Platforms: $PLATFORMS."
            if [ "$PLATFORMS" = "macos" ] || [ "$PLATFORMS" = "both" ] || [ "$PLATFORMS" = "all" ]; then
              echo "macOS is signed with a Developer ID and notarized."
            fi
            if [ "$PLATFORMS" = "windows" ] || [ "$PLATFORMS" = "both" ] || [ "$PLATFORMS" = "all" ]; then
              echo "Windows is unsigned; SmartScreen may warn on download."
            fi
            echo
            echo "This is a draft: installed apps do not see it until it is published."
          } > notes.md
          gh release edit "$TAG" --repo "$GITHUB_REPOSITORY" --notes-file notes.md
